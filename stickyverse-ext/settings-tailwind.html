<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StickyVerse Settings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 500: '#8b5cf6', 600: '#7c3aed' },
            accent: { 500: '#ec4899' }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 text-white flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold flex items-center justify-center gap-2">
        Sticky<span class="text-yellow-400">Verse</span> <span>✨</span>
      </h1>
    </div>

    <!-- Card -->
    <div class="glass border border-white/10 rounded-2xl p-6 space-y-6">
      <!-- Logged In State -->
      <div id="logged-in-section" class="hidden space-y-4">
        <div class="text-xs font-semibold text-white/70 uppercase tracking-wider mb-2">Connected Account</div>
        <div class="flex items-center gap-3 p-3 bg-white/5 rounded-xl">
          <div id="user-avatar" class="w-12 h-12 rounded-full bg-gradient-to-br from-violet-500 to-fuchsia-500 flex items-center justify-center text-lg font-semibold">?</div>
          <div>
            <h3 id="user-name" class="font-semibold">Loading...</h3>
            <p id="user-email" class="text-sm text-white/60">...</p>
          </div>
        </div>
      </div>

      <!-- Sync Status -->
      <div id="sync-section" class="hidden">
        <div class="text-xs font-semibold text-white/70 uppercase tracking-wider mb-2">Sync Status</div>
        <div class="flex items-center gap-2 text-sm text-white/60">
          <div id="sync-indicator" class="w-2 h-2 rounded-full bg-green-500"></div>
          <span id="sync-text">Sync enabled</span>
        </div>
      </div>

      <!-- Connect Token -->
      <div id="connect-section" class="space-y-4">
        <div class="text-xs font-semibold text-white/70 uppercase tracking-wider">Connect to Web</div>
        <div class="text-sm text-white/60 space-y-2">
          <p>To sync with the StickyVerse website:</p>
          <ol class="list-decimal ml-4 space-y-1">
            <li>Go to <a href="#" id="web-link" class="text-violet-400 hover:text-violet-300">stickyverse.app</a></li>
            <li>Sign in with your Google account</li>
            <li>Click "Connect Extension" on your dashboard</li>
          </ol>
        </div>
        <div class="space-y-2">
          <label for="auth-token" class="text-sm font-medium text-white/80">Paste your auth token:</label>
          <textarea id="auth-token" placeholder="Paste token from website..." class="w-full min-h-[100px] p-3 bg-white/5 border border-white/10 rounded-lg text-sm text-white placeholder-white/40 focus:outline-none focus:border-violet-500 font-mono"></textarea>
        </div>
        <button id="connect-btn" class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-violet-500 to-fuchsia-500 hover:from-violet-600 hover:to-fuchsia-600 text-white font-semibold py-2.5 px-4 rounded-xl transition-all">
          Connect Account
        </button>
        <div id="message"></div>
      </div>

      <!-- Actions -->
      <div id="actions-section" class="hidden space-y-3">
        <button id="sync-btn" class="w-full flex items-center justify-center gap-2 bg-white/10 hover:bg-white/15 border border-white/20 text-white font-medium py-2.5 px-4 rounded-xl transition-all">
          Force Sync Now
        </button>
        <button id="disconnect-btn" class="w-full flex items-center justify-center gap-2 bg-red-500/20 hover:bg-red-500/30 text-red-400 font-medium py-2.5 px-4 rounded-xl transition-all border border-red-500/30">
          Disconnect Account
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="settings.js"></script>
</body>
</html>
