<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StickyVerse Settings</title>
  <script src="css-loader.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); }
    .hidden { display: none !important; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 text-white flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold flex items-center justify-center gap-2">
        Sticky<span class="text-yellow-400">Verse</span> <span>✨</span>
      </h1>
    </div>

    <!-- Card -->
    <div class="glass border border-white/10 rounded-2xl p-6 space-y-6">
      
      <!-- CONNECT SECTION (shown when NOT logged in) -->
      <div id="connect-section" class="space-y-4">
        <div class="text-xs font-semibold text-white/70 uppercase tracking-wider">Connect to Web</div>

        <div class="text-sm text-white/60 space-y-2">
          <p>To sync with the StickyVerse website:</p>
          <ol class="list-decimal ml-4 space-y-1">
            <li>Go to <a href="#" id="web-link" class="text-violet-400 hover:text-violet-300 underline">peaceful-peony-58cb08.netlify.app</a></li>
            <li>Sign in with your Google account</li>
            <li>Return here — you'll be automatically connected</li>
          </ol>
        </div>

        <!-- Auto-connect status -->
        <div id="connect-status" class="p-3 bg-white/5 border border-white/10 rounded-lg text-sm text-white/70">
          Waiting for website login...
        </div>

        <!-- Message display -->
        <div id="message" class="hidden"></div>
      </div>

      <!-- LOGGED IN SECTION (shown when connected) -->
      <div id="logged-in-section" class="hidden space-y-4">
        <div class="text-xs font-semibold text-white/70 uppercase tracking-wider mb-2">Connected Account</div>
        
        <div class="flex items-center gap-3 p-3 bg-white/5 rounded-xl">
          <div id="user-avatar" class="w-12 h-12 rounded-full bg-gradient-to-br from-violet-500 to-fuchsia-500 flex items-center justify-center text-lg font-semibold">?</div>
          <div>
            <h3 id="user-name" class="font-semibold">Loading...</h3>
            <p id="user-email" class="text-sm text-white/60">...</p>
          </div>
        </div>

        <!-- Sync Section -->
        <div id="sync-section">
          <div class="text-xs font-semibold text-white/70 uppercase tracking-wider mb-2">Sync Status</div>
          <div class="flex items-center gap-2 text-sm text-white/60">
            <div id="sync-indicator" class="w-2 h-2 rounded-full bg-green-500"></div>
            <span id="sync-text">Sync enabled</span>
          </div>
        </div>

        <!-- Actions Section -->
        <div id="actions-section" class="space-y-3 pt-4 border-t border-white/10">
          <button 
            id="sync-btn" 
            class="w-full flex items-center justify-center gap-2 bg-white/10 hover:bg-white/15 border border-white/20 text-white font-medium py-2.5 px-4 rounded-xl transition-all"
          >
            Force Sync Now
          </button>
          
          <button 
            id="disconnect-btn" 
            class="w-full flex items-center justify-center gap-2 bg-red-500/20 hover:bg-red-500/30 text-red-400 font-medium py-2.5 px-4 rounded-xl transition-all border border-red-500/30"
          >
            Disconnect Account
          </button>
        </div>
      </div>

    </div>
  </div>

  <script src="supabase.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="settings.js"></script>
</body>
</html>
