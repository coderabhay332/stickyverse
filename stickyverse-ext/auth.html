<!DOCTYPE html>
<html lang="en" data-theme="void">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - StickyVerse ✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="newtab.css">
  <style>
    .auth-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .auth-card {
      background: rgba(15, 10, 35, 0.85);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 48px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .auth-logo {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #A78BFA, #EC4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .auth-subtitle {
      color: rgba(255,255,255,0.6);
      margin-bottom: 32px;
      font-size: 14px;
    }
    .google-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      background: white;
      color: #333;
      padding: 12px 24px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      margin: 0 auto;
    }
    .google-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    .google-icon {
      width: 20px;
      height: 20px;
    }
    .loading {
      display: none;
      color: #A78BFA;
      margin-top: 16px;
    }
    .error {
      display: none;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 12px;
      border-radius: 8px;
      margin-top: 16px;
      font-size: 14px;
    }
    .features {
      margin-top: 32px;
      padding-top: 32px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .feature-item {
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      margin-bottom: 8px;
    }
    .feature-item i {
      color: #A78BFA;
      width: 16px;
    }
  </style>
</head>
<body>
  <div id="bg">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="blob b4"></div>
  </div>
  <div id="grid-overlay"></div>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">StickyVerse ✨</div>
      <div class="auth-subtitle">Your aesthetic digital workspace</div>
      
      <button id="google-signin-btn" class="google-btn">
        <svg class="google-icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>
      
      <div id="loading" class="loading">
        <i class="fa-solid fa-spinner fa-spin"></i> Signing in...
      </div>
      
      <div id="error" class="error"></div>
      
      <div class="features">
        <div class="feature-item">
          <i class="fa-solid fa-cloud"></i>
          <span>Sync across all your devices</span>
        </div>
        <div class="feature-item">
          <i class="fa-solid fa-lock"></i>
          <span>Secure and private</span>
        </div>
        <div class="feature-item">
          <i class="fa-solid fa-infinity"></i>
          <span>Unlimited notes and links</span>
        </div>
        <div class="feature-item">
          <i class="fa-solid fa-bolt"></i>
          <span>Real-time collaboration</span>
        </div>
      </div>
    </div>
  </div>

  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
