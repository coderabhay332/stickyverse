<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StickyVerse</title>
  <link rel="stylesheet" href="dist/styles.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="w-72 bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 text-white">
  <div class="p-4">
    <!-- Header -->
    <div class="text-center mb-4">
      <h1 class="text-lg font-bold flex items-center justify-center gap-1">
        sticky<span class="text-yellow-400">Verse</span> <span>✨</span>
      </h1>
      <p class="text-xs text-white/60">Your creative workspace</p>
    </div>

    <!-- Buttons -->
    <div class="space-y-2">
      <button id="open-workspace-btn" class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-violet-500 to-fuchsia-500 hover:from-violet-600 hover:to-fuchsia-600 text-white font-semibold py-2.5 px-4 rounded-xl transition-all transform hover:scale-[1.02] active:scale-[0.98] shadow-lg shadow-violet-500/25">
        <span>🚀</span>
        <span>Open Workspace</span>
      </button>

      <button id="save-tab-btn" class="w-full flex items-center justify-center gap-2 bg-white/10 hover:bg-white/20 border border-white/20 text-white font-medium py-2.5 px-4 rounded-xl transition-all">
        <span>🔗</span>
        <span>Save Current Tab</span>
      </button>

      <button id="settings-btn" class="w-full flex items-center justify-center gap-2 bg-white/5 hover:bg-white/10 border border-white/10 text-white/80 font-medium py-2.5 px-4 rounded-xl transition-all">
        <span>⚙️</span>
        <span>Settings & Sync</span>
      </button>
    </div>

    <!-- Toast -->
    <div id="popup-toast" class="hidden mt-3 p-2 bg-green-500/20 border border-green-500/30 rounded-lg text-center text-sm text-green-300">
      ✓ Tab saved to Link Vault!
    </div>

    <!-- Footer -->
    <div class="mt-4 pt-3 border-t border-white/10 flex items-center justify-center gap-2 text-xs text-white/50">
      <span id="note-count">0 notes</span>
      <span>·</span>
      <span id="link-count">0 links</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
